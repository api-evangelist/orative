name: Orative
description: 'Orative Corporation was an enterprise software company that built conferencing and
  collaboration software for mobile business users, offering a client-server product to manage
  conversations, collaborate with colleagues, filter unwanted calls and notifications, and access
  personal and corporate directories. Founded in the early 2000s, it raised a $12M Series B in July
  2004 led by Trinity Ventures (with Mayfield and Diamondhead Ventures) and was acquired by Cisco
  Systems in October 2006. The company is defunct: there is no live product, developer portal, or
  API surface today. This profile was surfaced as a Trinity Ventures portfolio company and processed
  by the API Evangelist enrichment pipeline, which confirmed no current API surface exists.'
